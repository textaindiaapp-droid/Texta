
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TEXTA - Phase 0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --accent-primary: #6366f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #fdfdff;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            margin: 0;
            font-size: 14px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(220%);
            -webkit-backdrop-filter: blur(50px) saturate(220%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.05);
        }

        .liquid-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 1.5rem;
            transition: all 0.6s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .liquid-card:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .scroll-mask {
            mask-image: linear-gradient(to bottom, transparent 0%, black 60px, black calc(100% - 100px), transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 60px, black calc(100% - 100px), transparent 100%);
        }

        .label-caps {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .mesh-bg {
            background-color: #fdfdff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,95%,1) 0, transparent 55%), 
                radial-gradient(at 100% 0%, hsla(225,39%,93%,1) 0, transparent 55%),
                radial-gradient(at 100% 100%, hsla(253,100%,97%,1) 0, transparent 55%),
                radial-gradient(at 0% 100%, hsla(225,39%,95%,1) 0, transparent 55%);
            background-size: 200% 200%;
            animation: fluidMotion 30s ease-in-out infinite alternate;
        }

        @keyframes fluidMotion {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .animate-liquid-reveal > * {
            opacity: 0;
            transform: translateY(15px);
            filter: blur(8px);
            animation: liquidReveal 1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        .animate-liquid-reveal > *:nth-child(1) { animation-delay: 0.05s; }
        .animate-liquid-reveal > *:nth-child(2) { animation-delay: 0.1s; }
        .animate-liquid-reveal > *:nth-child(3) { animation-delay: 0.15s; }

        @keyframes liquidReveal {
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.1); border-radius: 20px; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "firebase/app": "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js",
    "firebase/storage": "https://www.gstatic.com/firebasejs/11.4.0/firebase-storage.js",
    "firebase/": "https://esm.sh/firebase@^12.8.0/"
  }
}
</script>
</head>
<body class="mesh-bg">
    <div id="root"></div>
</body>
</html>
